name: Update Weather Data

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run update script
        run: node scripts/update.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cities/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weather data for $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Daily weather update failed for $(date -u +%Y-%m-%d)" \
            --body "The scheduled update-data workflow failed. Check the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
